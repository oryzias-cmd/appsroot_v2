<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>テンプレ：カード選択</title>
<link rel="stylesheet" href="../../shared/css/base.css">
<link rel="stylesheet" href="./css/app.css">
<script src="../../shared/js/shapes.js" defer></script>
<script src="../../shared/js/colors_shapes10.js" defer></script>
<script src="../../shared/js/common.js" defer></script>
<script src="./js/app.js" defer></script>
</head><body>
<header class="app-header">
  <button class="btn btn-back" onclick="history.back()">{ もどる }</button>
  <h1 class="title">カード選択テンプレ</h1>
  <button class="btn btn-help" onclick="alert('お題に当てはまるものをすべて選ぼう')">？</button>
</header>

<section class="prompt-area">
  <div class="prompt-card"><div class="prompt-label">お題</div>
    <div id="promptText" class="prompt-text">3つの辺で囲まれているもの</div>
  </div>
  <div class="prompt-controls">
    <label><input type="checkbox" id="toggleColor"> 色をつける</label>
  </div>
</section>

<main class="gallery-area">
  <div id="gallery" class="shape-gallery" aria-label="図形一覧"></div>
</main>

<footer class="app-footer">
  <div class="left-tools"><label>倍率 <select id="scaleSelect"></select></label></div>
  <div class="main-controls">
    <button class="btn" id="btnRetry">{ やり直し }</button>
    <button class="btn" id="btnNext">{ つぎの問題 }</button>
  </div>
</footer>
</body></html>
