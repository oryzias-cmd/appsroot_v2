<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>くくの れんしゅう（せってい）</title>

  <!-- 共通シェル -->
  <link rel="stylesheet" href="../../../common/shell/header.full.css">
  <link rel="stylesheet" href="../../../common/shell/setup.full.css">
  <link rel="stylesheet" href="../../../common/shell/tenkeypad.full.css">
  <link rel="stylesheet" href="../../../common/shell/entry.full.css">

  <!-- 旧entry.cssは手組み用なので読まない（衝突防止） -->
</head>
<body data-appkey="kuku.entry">

  <!-- kit が読むスロット -->
  <div id="slot-header"
       data-slot="header"
       data-title="くくの れんしゅう"
       data-back="history"></div>

  <!-- SetupCardのmount先 -->
  <main id="mainArea"></main>

  <!-- ★重要：kit.full.js が読む前に宣言（左右ボタンが確実に出る） -->
  <script>
    window.AppShellLayout = {
      header:{ left:['backlink'], center:['title'], right:[] },
      pbar:{ left:[], center:[], right:[] },
      main:{ bottomCenter:[] },
      footer:{ left:[], center:[], right:[] }
    };
  </script>

  <!-- 共通レゴ -->
  <script src="../../../common/shell/kit.full.js"></script>
  <script src="../../../common/shell/header.full.js"></script>

  <!-- SetupCard（テンキー含む） -->
  <script src="../../../common/shell/tenkeypad.full.js"></script>
  <script src="../../../common/shell/setup.full.js"></script>
  <script src="../../../common/shell/entry.full.js"></script>

  <!-- 九九 entry（レゴ登録） -->
  <script src="./entry.js"></script>
</body>
</html>
