<!DOCTYPE html>
<!--
【設計前提（重要）】
・ヘッダーの左右ボタン等の中身は kit.full.js（L.header）で一元管理。
・header.full.js は「枠と最低限の表示」のみを担当。
・アプリ個別JSから #slot-header に直接注入しない。
・前提を変える提案は、必ず最初に宣言してから行う。
-->
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ながさ（せってい）</title>

  <!-- 共通シェル（Entry Lego） -->
  <link rel="stylesheet" href="../../../common/shell/header.css">
  <link rel="stylesheet" href="../../../common/shell/setup.full.css">
  <link rel="stylesheet" href="../../../common/shell/entry.full.css">

  <!-- entry専用（既存の見た目は残す：上書きはここで行う） -->
  <link rel="stylesheet" href="./length_entry.css">
</head>

<body data-appkey="length.entry">
  <!-- kit が読むスロット -->
  <div id="slot-header"
       data-slot="header"
       data-title="ながさを 読む"></div>

  <!-- SetupCard の mount 先 -->
  <main id="mainArea"></main>

  <!-- ★重要：kit.full.js が読む前に宣言（entryは歯車なし固定） -->
  <script>
    window.AppShellLayout = {
      header:{ left:['backlink'], center:['title'], right:[] },
      pbar:{ left:[], center:[], right:[] },
      main:{ bottomCenter:[] },
      footer:{ left:[], center:[], right:[] }
    };
  </script>

  <!-- 共通レゴ -->
  <script src="../../../common/shell/kit.full.js"></script>
  <script src="../../../common/shell/header.full.js"></script>
  <script src="../../../common/shell/setup.full.js"></script>
  <script src="../../../common/shell/entry.full.js"></script>

  <!-- アプリ個別（EntryFull.register） -->
  <script src="./length_entry.js"></script>
</body>
</html>
