     ★defer を外して「この場で」QUESTIONS を確実に作る -->
<script src="./shape2defineBasicQ.js"></script>
<script>
  window.QUESTIONS = window.QUESTIONS || window.APP_QUESTIONS || window.Q_TRIQUAD_DEFINE || [];

  // ★出題順ランダム化：表示(M-Define)より前に1回だけ実行
  (function(){
    const qs = window.QUESTIONS;
    if (!Array.isArray(qs) || qs.length <= 1 || qs.__shuffled) return;
    for (let i = qs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [qs[i], qs[j]] = [qs[j], qs[i]];
    }
    Object.defineProperty(qs, "__shuffled", { value:true, enumerable:false });
  })();
</script>
