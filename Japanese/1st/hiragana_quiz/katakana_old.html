<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>カタカナ くいず</title>
<style>
  :root{
    --stack-gap: clamp(16px, 3vh, 28px);
    --choice-size: clamp(84px, 10vw, 120px);
    --choice-font: clamp(56px, 7.5vw, 84px);
    --question-font: clamp(48px, 6.5vw, 84px);
    --num-font: clamp(28px, 4vw, 42px);
    --icon-size: clamp(64px, 7.5vw, 88px);
    --question-box-w: clamp(360px, 40vw, 520px);
    --image-max-h: 28vh;
    --gap-ic: 28px;
    --nav-gap: clamp(12px, 2.5vw, 24px);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:"Yu Kyokasho","YuKyokasho","UD Digi Kyokasho N-R",sans-serif;
    margin:0; padding:16px; text-align:center; background:#fff; color:#000;
  }
  .hidden{ display:none !important; }

  /* （ひらがな版と同じ見た目に統一） */
  button{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background:none; border:none; padding:0; margin:0; color:inherit; font:inherit;
  }

  /* ============ 共通ボタン（ひらがな版と同じ） ============ */
  .btn{
    font-size: clamp(22px,4.2vw,28px);
    padding: clamp(14px,2.6vw,20px) clamp(22px,4vw,28px);
    border-radius: 9999px; border:3px solid #333; background:#fff; cursor:pointer;
    min-width: clamp(140px,30vw,240px);
    font-family:"Yu Kyokasho","YuKyokasho","UD Digi Kyokasho N-R",sans-serif;
    transition: transform .05s ease;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-cancel{ border-color:#888; color:#555; }

  /* ============ トップ（メニュー）…ひらがな版と完全一致 ============ */
  #home{
    min-height:100svh;
    display:grid;
    /* 上=タイトル / 中=ボタン / 下=サブタイトル */
    grid-template-rows: 0.55fr auto 1.45fr; /* ←ここで“上へ”寄せる量を調整 */
    justify-items:center;
    align-items:center;
    gap: 20px;
    position:relative;
    padding: 0 16px;
  }
  /* タイトル（上ブロックの下端） */
  #home .home-title{
    grid-row:1;
    align-self:end; justify-self:center;
    font-size: clamp(32px,5.5vw,48px);
    margin:0;
  }
  /* 4ボタン（中央ど真ん中・折返しなし） */
  #home .btnrow{
    grid-row:2;
    align-self:center; justify-self:center;
    display:flex; flex-wrap:nowrap; gap: clamp(18px, 3vw, 28px);
  }
  #home .btn{ min-width: clamp(140px,22vw,240px); }
  /* サブタイトル（下ブロックの上端） */
  #home .home-sub{
    grid-row:3;
    align-self:start; justify-self:center;
    font-size: clamp(18px,3.4vw,24px);
    color:#444; margin:0;
  }

  /* 4ボタンの“下”に出す選択パネル（位置はボタン列直下に固定） */
  #home .picker{
    width:min(92vw,760px);
    margin:12px auto 0;
    background:#fff; border:3px solid #333; border-radius:16px; padding:14px;
    display:none; position:fixed; z-index:9;     /* 重なり防止のため固定 */
    box-shadow:0 10px 28px rgba(0,0,0,.12);
  }
  #home .picker-title{ margin:0 0 12px; font-size:clamp(18px,3vw,22px); text-align:left; }
  #home .grid{
    display:grid; gap:clamp(10px,1.4vw,14px);
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  }
  #home .grid .btn{ min-width:auto; padding:clamp(10px,1.8vw,14px) 0; }
  #home .picker-footer{ margin-top:12px; display:flex; justify-content:flex-end; }

  /* 画面下固定「メニュー」ボタン（同じ） */
  .menu-btn-wrap{
    position: fixed;
    bottom: clamp(24px, 5vh, 40px);
    left: 0; width: 100%;
    display:flex; justify-content:center;
    z-index: 10;
    pointer-events:none;
  }
  .btn-menu{
    pointer-events:auto;
    font-size: clamp(20px, 4vw, 28px);
    padding: clamp(12px, 2.5vw, 18px) clamp(28px, 5vw, 36px);
    border-radius: 12px;
    background: #fff8cc;
    border: 3px solid #d4a200;
    color: #333;
    font-family:"Yu Kyokasho","YuKyokasho","UD Digi Kyokasho N-R",sans-serif;
    cursor: pointer;
    transition: transform .05s ease, background-color .15s ease;
  }
  .btn-menu:hover{ background:#fff2a3; }
  .btn-menu:active{ transform: translateY(1px); }

  /* ============ クイズ画面（ひらがな版と同じ） ============ */
  #quiz{
    min-height:100svh;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:var(--stack-gap); position:relative;
  }
  .title{ position:absolute; top:8px; right:14px; font-size:16px; color:gray; user-select:none; }

  .header-wrap{ display:flex; justify-content:center; width:100%; }
  .header{
    display:grid;
    grid-template-columns: var(--icon-size) var(--gap-ic) var(--question-box-w) var(--gap-ic) var(--icon-size);
    align-items:center; justify-content:center;
    border-bottom: 4px solid blue;
    padding-bottom: 4px;
    margin-bottom: 60px;
  }

  .speed-btn{
    width:var(--icon-size); height:var(--icon-size);
    border:3px solid #888; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    user-select:none; cursor:pointer; background:#fff; overflow:hidden;
  }
  .speed-btn img{ width:100%; height:100%; object-fit:contain; display:block; }
  .speed-btn:active{ transform:scale(0.98); }

  .question-box{ width: var(--question-box-w); display:flex; align-items:center; justify-content:center; }
  .question{ font-size:var(--question-font); line-height:1.1; margin:0; user-select:none; }

  .choices{
    display:grid; grid-template-columns: repeat(4, var(--choice-size));
    justify-content:center; gap: clamp(16px, 3vw, 30px);
    margin:0 auto; position:relative;
    padding-left:  max(0px, var(--nav-gap));
    padding-right: max(0px, var(--nav-gap));
  }
  .choice{
    width:var(--choice-size); height:var(--choice-size);
    border:3px solid gray; background:#fff;
    display:flex; align-items:center; justify-content:center;
    position:relative; user-select:none;
  }
  .say{ font-size:var(--choice-font); line-height:1; color:#000; }
  .number{
    position:absolute; top: calc(var(--num-font) * -1.2);
    left:50%; transform:translateX(-50%);
    font-size:var(--num-font); cursor:pointer; color:#000;
  }
  .circle-mark{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size: calc(var(--choice-size) * 1.35);
    font-weight:bold; color:red;
    font-family:"Arial Black","Yu Gothic UI",sans-serif; pointer-events:none;
  }
  .cross-mark{
    position:absolute; top: calc(var(--num-font) * (-1.6 - 0.15));
    left:50%; transform:translateX(-50%);
    font-size: var(--num-font); font-weight:bold; color:blue;
    font-family:"Arial Black","Yu Gothic UI",sans-serif; pointer-events:none;
  }

  img.hint{
    max-width:90vw; max-height:var(--image-max-h);
    width:auto; height:auto; margin:8px auto 0; display:block; object-fit:contain;
    opacity:1 !important; min-height: var(--image-max-h); background: #eee;
    user-select: none; caret-color: transparent;
  }

  .nav-btn{
    position:absolute; top: 50%; transform: translateY(-50%);
    padding: 12px 18px; border:3px solid #333; background:#fff; border-radius:9999px; cursor:pointer;
    font-size: clamp(18px,2.8vw,22px); white-space:nowrap; display:none;
  }
  #btn-next{ left:  calc(100% + var(--choice-size)*0.2 + var(--nav-gap)); }
  #btn-quit{ right: calc(100% + var(--choice-size)*0.2 + var(--nav-gap)); }
  @media (max-width: 900px){
    #btn-next{ left:  calc(100% + var(--nav-gap)); }
    #btn-quit{ right: calc(100% + var(--nav-gap)); }
  }
  #quiz, #quiz * { caret-color: transparent; }

  /* 結果 */
  #result{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background: rgba(0,0,0,0.35); }
  .result-card{ background:#fff; padding:24px; border-radius:16px; min-width:min(92vw,560px); text-align:center; border:3px solid #333; }
  .res-score{ margin:8px 0 16px; font-size: clamp(40px,6vw,56px); color:#c40000; font-weight:bold; }
  .res-msg{ margin:0 0 12px; font-size: clamp(20px,3vw,24px); }
  .res-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  #confetti{ position:fixed; inset:0; pointer-events:none; }
</style>
</head>
<body>

<!-- ===== トップ（4コース） ===== -->
<section id="home">
  <h1 class="home-title">カタカナ くいず</h1>

  <div class="btnrow">
    <button class="btn" data-course="rand5">5もん</button>
    <button class="btn" data-course="rand10">10もん</button>
    <button class="btn" id="btn-open-tate">たて</button>
    <button class="btn" id="btn-open-yoko">よこ</button>
  </div>

  <p class="home-sub">やりたい こーす を えらんでね</p>

  <div class="menu-btn-wrap">
    <button class="btn-menu" id="btn-open-menu">メニュー</button>
  </div>

  <!-- 4ボタンの“下”に出す -->
  <div id="picker-tate" class="picker" aria-hidden="true">
    <p class="picker-title">たて を えらんでね（『ヤ＋ワ』 は いっしょ）</p>
    <div class="grid" id="grid-tate"></div>
    <div class="picker-footer"><button class="btn btn-cancel" id="close-tate">とじる</button></div>
  </div>

  <div id="picker-yoko" class="picker" aria-hidden="true">
    <p class="picker-title">よこ を えらんでね</p>
    <div class="grid" id="grid-yoko"></div>
    <div class="picker-footer"><button class="btn btn-cancel" id="close-yoko">とじる</button></div>
  </div>
</section>

<!-- ===== クイズ ===== -->
<section id="quiz">
  <div class="title">カタカナ くいず</div>

  <div class="header-wrap">
    <div class="header" aria-label="おんせい と もんだい">
      <div class="speed-btn" id="btn-fast"><img id="ic-usagi" src="./images/usagi.png" alt="うさぎ"></div>
      <div aria-hidden="true"></div>
      <div class="question-box"><p class="question" id="qText">○サガオ</p></div>
      <div aria-hidden="true"></div>
      <div class="speed-btn" id="btn-slow"><img id="ic-kame" src="./images/kame.png" alt="かめ"></div>
    </div>
  </div>

  <div class="choices" id="choices">
    <div class="choice" data-letter="ア"><div class="number" data-answer>①</div><div class="say">ア</div></div>
    <div class="choice" data-letter="オ"><div class="number" data-answer>②</div><div class="say">オ</div></div>
    <div class="choice" data-letter="ノ"><div class="number" data-answer>③</div><div class="say">ノ</div></div>
    <div class="choice" data-letter="メ"><div class="number" data-answer>④</div><div class="say">メ</div></div>

    <button id="btn-next" class="nav-btn">つぎへ ▶</button>
    <button id="btn-quit" class="nav-btn">◀ もどる</button>
  </div>

  <img src="./images/asagao.jpg" alt="あさがお" class="hint" id="hintImg" />
</section>

<!-- 結果 -->
<section id="result">
  <div class="result-card">
    <p class="res-msg" id="resMsg">がんばって</p>
    <p class="res-score" id="resScore">0 / 5</p>
    <div class="res-row">
      <button class="btn" id="btn-retry-wrong">もういちど（まちがえた もんだい）</button>
      <button class="btn" id="btn-back-home">もどる</button>
    </div>
  </div>
</section>

<canvas id="confetti"></canvas>

<script>
/* ===================== データ（ひら→カタ自動生成） ===================== */
const DB = {
  hira: {
    "あ": { "words": [ {"word":"あり","romaji":"ari"}, {"word":"あさがお","romaji":"asagao"}, {"word":"あじさい","romaji":"azisai"}, {"word":"あめ","romaji":"ame"} ] },
    /* ……あなたのひらがなデータを全てここに…… */
    "わ": { "words": [ {"word":"わに","romaji":"wani"}, {"word":"わさび","romaji":"wasabi"}, {"word":"わた","romaji":"wata"}, {"word":"わごむ","romaji":"wagomu"} ] }
  }
};

const H2K_MAP = {"あ":"ア","い":"イ","う":"ウ","え":"エ","お":"オ","か":"カ","き":"キ","く":"ク","け":"ケ","こ":"コ","さ":"サ","し":"シ","す":"ス","せ":"セ","そ":"ソ","た":"タ","ち":"チ","つ":"ツ","て":"テ","と":"ト","な":"ナ","に":"ニ","ぬ":"ヌ","ね":"ネ","の":"ノ","は":"ハ","ひ":"ヒ","ふ":"フ","へ":"ヘ","ほ":"ホ","ま":"マ","み":"ミ","む":"ム","め":"メ","も":"モ","や":"ヤ","ゆ":"ユ","よ":"ヨ","ら":"ラ","り":"リ","る":"ル","れ":"レ","ろ":"ロ","わ":"ワ","を":"ヲ","ん":"ン","ぁ":"ァ","ぃ":"ィ","ぅ":"ゥ","ぇ":"ェ","ぉ":"ォ","ゃ":"ャ","ゅ":"ュ","ょ":"ョ","っ":"ッ","ゔ":"ヴ","ゎ":"ヮ"};
const hiraToKata = s => [...s].map(ch=>H2K_MAP[ch] ?? ch).join("");
DB.kata = {};
for (const [hKana, entry] of Object.entries(DB.hira)) {
  const kKana = hiraToKata(hKana);
  DB.kata[kKana] = { words: (entry.words||[]).map(w=>({ word:hiraToKata(w.word||""), romaji:w.romaji||"" })) };
}

/* まぎらわし（カタ） */
const CONFUSERS_HIRA = {"あ":["お","め","ぬ"],"い":["り","こ","し"],"う":["る","ら","つ"],"え":["ろ","そ","ぬ"],"お":["あ","め","を"],"か":["が","さ","ち"],"き":["さ","に","ち"],"く":["ぐ","て","へ"],"け":["さ","は","ほ"],"こ":["さ","よ","え"],"さ":["き","ち","は"],"し":["つ","い","こ"],"す":["ぬ","む","え"],"せ":["そ","さ","え"],"そ":["え","す","る"],"た":["な","ち","さ"],"ち":["さ","き","つ"],"つ":["し","す","く"],"て":["く","へ","さ"],"と":["し","り","そ"],"な":["め","ぬ","た"],"に":["き","こ","け"],"ぬ":["め","ね","る"],"ね":["め","ぬ","れ"],"の":["め","ぬ","ね"],"は":["ほ","け","さ"],"ひ":["ぴ","に","り"],"ふ":["す","ぬ","む"],"へ":["て","く","ぬ"],"ほ":["は","ま","も"],"ま":["ほ","は","も"],"み":["に","す","さ"],"む":["ぬ","め","す"],"め":["ぬ","ね","ま"],"も":["ほ","ま","は"],"や":["わ","ゆ","よ"],"ゆ":["や","よ","わ"],"よ":["ゆ","や","を"],"ら":["う","ろ","る"],"り":["い","れ","こ"],"る":["ろ","ら","う"],"れ":["ね","り","ら"],"ろ":["る","ら","え"],"わ":["や","ゆ","を"],"を":["お","よ","わ"],"ん":["る","れ","い"]};
const CONFUSERS_KATA={}; for(const [h,a] of Object.entries(CONFUSERS_HIRA)) CONFUSERS_KATA[hiraToKata(h)] = a.map(hiraToKata);

/* 行・段（カタ） */
const ROW_TABLE={"ア":["ア","イ","ウ","エ","オ"],"カ":["カ","キ","ク","ケ","コ"],"サ":["サ","シ","ス","セ","ソ"],"タ":["タ","チ","ツ","テ","ト"],"ナ":["ナ","ニ","ヌ","ネ","ノ"],"ハ":["ハ","ヒ","フ","ヘ","ホ"],"マ":["マ","ミ","ム","メ","モ"],"ヤ":["ヤ","","ユ","","ヨ"],"ラ":["ラ","リ","ル","レ","ロ"],"ワ":["ワ","","","","ヲ"]};
const ROW_KEYS=["ア","カ","サ","タ","ナ","ハ","マ","ヤ＋ワ","ラ"];
const ROW_KEY_INTERNAL=["ア","カ","サ","タ","ナ","ハ","マ","ヤワ","ラ"];
const DAN_KEYS=["ア","イ","ウ","エ","オ"];

/* ===== 語中・語末も出題できるインデックス ===== */
const WORD_INDEX={ kata:{} };
const isKata = ch => (ch>="ァ" && ch<="ヶ") || ch==="ヲ" || ch==="ン";
function rebuildIndex(script){
  WORD_INDEX[script]={};
  const table=DB[script];
  Object.keys(table).forEach(k=>{
    (table[k].words||[]).forEach(ent=>{
      const w=ent.word||""; const posMap={};
      [...w].forEach((ch,i)=>{ if(isKata(ch)) (posMap[ch] ||= []).push(i); });
      Object.keys(posMap).forEach(c=>{
        (WORD_INDEX[script][c] ||= []).push({word:w,romaji:ent.romaji||"",kana:c,positions:posMap[c]});
      });
    });
  });
}
rebuildIndex("kata");

/* ○マスク */
function buildMaskedWord(word,kana,pos){
  const cs=[...word]; let p=typeof pos==="number"?pos:0;
  if(kana==="ヲ"||kana==="ン"){ const i=cs.findIndex(c=>c===kana); p = i>=0?i:Math.min(2, cs.length-1); }
  if(cs[p]!=null) cs[p]="○"; return cs.join("");
}

/* ===== 状態（一度だけ宣言） ===== */
let currentCourse=null, qIndex=0, correctCount=0, wrongBank=[];
let firstClickMade=false, firstClickCorrect=false, thisQuestionHadWrong=false;
let wordFast=null, wordSlow=null, lastPair=null;

/* ===== ピックアップ（袋法・直前回避） ===== */
const BAG={};
const keyFor=(s,k)=>`${s}|${k}`;
function refillFromIndex(s,k){ const list=(WORD_INDEX[s]&&WORD_INDEX[s][k])||[]; BAG[keyFor(s,k)]=Array.from({length:list.length},(_,i)=>i); }
function pickFromIndexAvoid(s,k,avoid){
  const list=(WORD_INDEX[s]&&WORD_INDEX[s][k])||[]; if(!list.length) return null;
  const K=keyFor(s,k); if(!Array.isArray(BAG[K])||!BAG[K].length) refillFromIndex(s,k);
  if(list.length===1){ const o=list[0]; const pos=o.positions[Math.floor(Math.random()*o.positions.length)]??0; return {word:o.word,romaji:o.romaji,pos}; }
  let tries=0,tmp=[];
  while(tries<8 && BAG[K].length){
    const b=BAG[K]; const i=Math.floor(Math.random()*b.length); const pick=b.splice(i,1)[0]; const cand=list[pick];
    if(!avoid || cand.word!==avoid){ const pos=cand.positions[Math.floor(Math.random()*cand.positions.length)]??0; if(tmp.length){BAG[K].push(...tmp);tmp.length=0;} return {word:cand.word,romaji:cand.romaji,pos}; }
    tmp.push(pick); tries++;
  }
  if(tmp.length){ BAG[K].push(...tmp); tmp.length=0; }
  const fidx=BAG[K].splice(Math.floor(Math.random()*BAG[K].length),1)[0]; const f=list[fidx];
  const pos=f.positions[Math.floor(Math.random()*f.positions.length)]??0;
  return {word:f.word,romaji:f.romaji,pos};
}

/* ========= 画面要素 ========= */
const home=document.getElementById('home'), quiz=document.getElementById('quiz'), resultOverlay=document.getElementById('result');
const pickerTate=document.getElementById('picker-tate'), pickerYoko=document.getElementById('picker-yoko');
const qText=document.getElementById('qText'), hintImg=document.getElementById('hintImg');
const btnFast=document.getElementById('btn-fast'), btnSlow=document.getElementById('btn-slow');
const btnNext=document.getElementById('btn-next'), btnQuit=document.getElementById('btn-quit');

document.getElementById('ic-usagi').onerror=e=>{ e.target.remove(); btnFast.textContent="🐇"; };
document.getElementById('ic-kame').onerror=e=>{ e.target.remove(); btnSlow.textContent="🐢"; };

hintImg.onload=()=>{ hintImg.style.opacity='1'; hintImg.style.background='#fff'; };
hintImg.onerror=()=>{
  const ph=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480"><rect width="100%" height="100%" fill="#eeeeee"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#999999">No Image</text></svg>`;
  hintImg.src="data:image/svg+xml;utf8,"+encodeURIComponent(ph);
  hintImg.style.opacity='1'; hintImg.style.background='#eee';
};

/* 画面遷移 */
function toHome(){
  home.style.display="grid";
  quiz.style.display="none";
  resultOverlay.style.display="none";
  pickerTate.style.display='none';
  pickerYoko.style.display='none';
  hideNav(); wrongBank=[]; currentCourse=null;
}
function toQuiz(){ home.style.display="none"; quiz.style.display="flex"; resultOverlay.style.display="none"; }
function hideNav(){ btnNext.style.display="none"; btnQuit.style.display="none"; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr,n){ const b=[...arr]; shuffle(b); return b.slice(0,n); }

/* 出題プール */
function buildPoolByRandom(n){ const keys=Object.keys(WORD_INDEX.kata||{}); return sample(keys,n); }
function buildPoolByRow(rowKey){
  const rows={"ア":"アイウエオ","カ":"カキクケコ","サ":"サシスセソ","タ":"タチツテト","ナ":"ナニヌネノ","ハ":"ハヒフヘホ","マ":"マミムメモ","ヤワ":"ヤユヨワヲ","ラ":"ラリルレロ"};
  const chars=[...(rows[rowKey]||"")], sel=[]; chars.forEach(k=>{ if((WORD_INDEX.kata[k]||[]).length>0) sel.push(k); });
  return shuffle(sel);
}
function arrangeNoAdjacentSame(a){ a=[...a]; for(let i=1;i<a.length;i++){ if(a[i]===a[i-1]){ let j=i+1; while(j<a.length&&a[j]===a[i]) j++; if(j<a.length) [a[i],a[j]]=[a[j],a[i]]; else{ let k=i-2; while(k>=0&&a[k]===a[i]) k--; if(k>=0) [a[i],a[k]]=[a[k],a[i]]; } } } return a; }
function buildPoolByDan(d){
  const idx="アイウエオ".indexOf(d); const arr=[];
  for(const row of Object.keys(ROW_TABLE)){ const ch=ROW_TABLE[row][idx]||""; if(ch&&(WORD_INDEX.kata[ch]||[]).length>0) arr.push(ch); }
  shuffle(arr); let seq=[...arr]; if(seq.length<10){ if(seq[0]) seq.push(seq[0]); if(seq.length<10&&seq[1]) seq.push(seq[1]); }
  while(seq.length<10) seq.push(seq[Math.floor(Math.random()*arr.length)]);
  return arrangeNoAdjacentSame(seq.slice(0,10));
}

/* 音声・画像パス */
const audioBase="./audio";
const wordAudioPaths = r=>({fast:`${audioBase}/words/${r}_normal.mp3`,slow:`${audioBase}/words/${r}_05.mp3`});
const letterMap={ "ア":"a","イ":"i","ウ":"u","エ":"e","オ":"o","カ":"ka","キ":"ki","ク":"ku","ケ":"ke","コ":"ko","サ":"sa","シ":"shi","ス":"su","セ":"se","ソ":"so","タ":"ta","チ":"chi","ツ":"tsu","テ":"te","ト":"to","ナ":"na","ニ":"ni","ヌ":"nu","ネ":"ne","ノ":"no","ハ":"ha","ヒ":"hi","フ":"fu","ヘ":"he","ホ":"ho","マ":"ma","ミ":"mi","ム":"mu","メ":"me","モ":"mo","ヤ":"ya","ユ":"yu","ヨ":"yo","ラ":"ra","リ":"ri","ル":"ru","レ":"re","ロ":"ro","ワ":"wa","ヲ":"wo","ン":"n" };
function letterAudioPath(k){ return `${audioBase}/letters/${letterMap[k]||"a"}.mp3`; }
function imagePath(r){ return `./images/${r}.jpg`; }

/* クイズ描画（語頭/語中/語末に対応） */
function setQuestion(kana){
  try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch{}
  const avoid=(lastPair && lastPair.kana===kana)? lastPair.word : null;
  const picked = pickFromIndexAvoid("kata", kana, avoid) || {word:"",romaji:"",pos:0};
  const {word,romaji,pos} = picked;

  qText.textContent = buildMaskedWord(word, kana, pos);
  hintImg.style.opacity='1'; hintImg.style.background='#fff'; hintImg.src=imagePath(romaji);

  const p=wordAudioPaths(romaji); wordFast=new Audio(p.fast); wordSlow=new Audio(p.slow);

  const conf=CONFUSERS_KATA[kana] || [];
  const opts=shuffle([kana, ...sample(conf,3)]).slice(0,4);
  const nums=["①","②","③","④"]; const letters=document.querySelectorAll(".choice");

  firstClickMade=false; firstClickCorrect=false; thisQuestionHadWrong=false;

  letters.forEach((box,i)=>{
    const say=box.querySelector(".say"); const num=box.querySelector(".number");
    say.textContent=opts[i]; box.dataset.letter=opts[i];
    box.querySelectorAll(".circle-mark,.cross-mark").forEach(m=>m.remove());
    if(!num || !num.classList.contains("number")){
      const n=document.createElement("div"); n.className="number"; n.setAttribute("data-answer",""); n.textContent=nums[i]; box.prepend(n);
    }else{ num.textContent=nums[i]; }
  });

  document.querySelectorAll(".say").forEach(el=>{
    el.onclick=()=>{ const ap=letterAudioPath(el.textContent.trim()); try{const a=new Audio(ap); a.currentTime=0; a.play().catch(()=>{});}catch{} };
  });

  document.querySelectorAll("[data-answer]").forEach(numEl=>{
    numEl.onclick=()=>{
      const choice=numEl.parentElement; const letter=choice.dataset.letter;
      if(choice.querySelector(".circle-mark")) return;
      if(letter===kana){
        choice.appendChild(Object.assign(document.createElement("div"),{className:"circle-mark",textContent:"◯"}));
        if(!firstClickMade){ firstClickCorrect=true; correctCount++; }
        firstClickMade=true; btnNext.style.display="inline-block"; btnQuit.style.display="inline-block";
      }else{
        if(!numEl.classList.contains("answered")){
          const cross=document.createElement("div"); cross.className="cross-mark"; cross.textContent="×";
          numEl.replaceWith(cross); numEl.classList.add("answered");
        }
        if(!firstClickMade){ firstClickCorrect=false; }
        firstClickMade=true; thisQuestionHadWrong=true;
      }
    };
  });

  lastPair={kana,word};
  hideNav();
}

/* コース開始 */
function startGame(opt){
  let pool=[];
  if(opt.mode==='rand5'){ pool=buildPoolByRandom(5); }
  else if(opt.mode==='rand10'){ pool=buildPoolByRandom(10); }
  else if(opt.mode==='tate'){ pool=buildPoolByRow(opt.row || ROW_KEY_INTERNAL[Math.floor(Math.random()*ROW_KEY_INTERNAL.length)]); }
  else if(opt.mode==='yoko'){ pool=buildPoolByDan(opt.dan || DAN_KEYS[Math.floor(Math.random()*DAN_KEYS.length)]); }
  else{ pool=buildPoolByRandom(5); }

  pool = shuffle(pool.slice());
  currentCourse={mode:opt.mode, pick:pool};
  qIndex=0; correctCount=0; wrongBank=[];
  toQuiz(); setQuestion(currentCourse.pick[qIndex]);

  const stopBoth=()=>{ try{wordFast.pause();}catch{} try{wordSlow.pause();}catch{} };
  btnFast.onclick=()=>{ stopBoth(); if(wordFast){ wordFast.currentTime=0; wordFast.play().catch(()=>{}); } };
  btnSlow.onclick=()=>{ stopBoth(); if(wordSlow){ wordSlow.currentTime=0; wordSlow.play().catch(()=>{}); } };

  btnNext.onclick=()=>{
    if(thisQuestionHadWrong) wrongBank.push(currentCourse.pick[qIndex]);
    qIndex++;
    if(qIndex>=currentCourse.pick.length){ showResult(); }
    else{ setQuestion(currentCourse.pick[qIndex]); }
  };
  btnQuit.onclick=()=>{ toHome(); };
}

/* 結果 */
function showResult(){
  quiz.style.display="none";
  resultOverlay.style.display="flex";
  const total=currentCourse.pick.length, ratio=correctCount/total;
  const msgEl=document.getElementById('resMsg'), scoreEl=document.getElementById('resScore');
  scoreEl.textContent=`${correctCount} / ${total}`;
  if(correctCount===total){ msgEl.textContent="すばらしい！"; msgEl.style.color="#c40000"; confettiBurst(); }
  else if(ratio>=0.8){ msgEl.textContent="もうすこし"; msgEl.style.color="#0057d9"; }
  else{ msgEl.textContent="がんばって"; msgEl.style.color="#000"; }

  document.getElementById('btn-retry-wrong').disabled=(wrongBank.length===0);
  document.getElementById('btn-retry-wrong').onclick=()=>{
    if(wrongBank.length===0){ toHome(); return; }
    currentCourse={mode:"retry", pick:shuffle([...wrongBank])}; qIndex=0; correctCount=0; wrongBank=[];
    resultOverlay.style.display="none"; toQuiz(); setQuestion(currentCourse.pick[qIndex]);
  };
  document.getElementById('btn-back-home').onclick=()=>{ toHome(); };
}

/* 紙吹雪 */
function confettiBurst(){
  try{
    const c=document.getElementById('confetti'), ctx=c.getContext('2d');
    c.width=innerWidth; c.height=innerHeight;
    let parts=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.5,r:2+Math.random()*5,vy:1+Math.random()*3,vx:-1+Math.random()*2,a:0.6+Math.random()*0.4}));
    const colors=["#ff477e","#ffd166","#06d6a0","#118ab2","#ef476f","#8338ec","#fb5607"]; let t=0,id;
    (function loop(){ ctx.clearRect(0,0,c.width,c.height);
      parts.forEach((p,i)=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.02; ctx.globalAlpha=p.a; ctx.fillStyle=colors[i%colors.length]; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); });
      if(++t<180) id=requestAnimationFrame(loop); else ctx.clearRect(0,0,c.width,c.height);
    })();
    setTimeout(()=>cancelAnimationFrame(id),4000);
  }catch{}
}

/* ===== トップの4ボタン ===== */
document.querySelectorAll('#home .btn[data-course]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const c=btn.getAttribute('data-course');
    if(c==='rand5') startGame({mode:'rand5'});
    else if(c==='rand10') startGame({mode:'rand10'});
  });
});

/* メニューへ */
const btnOpenMenu=document.getElementById('btn-open-menu');
if(btnOpenMenu) btnOpenMenu.onclick=()=>{ location.href='./index.html'; };

/* サブメニューの開閉（ボタン列直下に固定） */
function placeAndOpen(pickerEl){
  const row=document.querySelector('#home .btnrow');
  const rect=row.getBoundingClientRect();
  const top=rect.bottom + 12;
  const w=Math.min(window.innerWidth*0.92,760);
  pickerEl.style.left = `calc(50% - ${w/2}px)`;
  pickerEl.style.top=`${top}px`;
  pickerEl.style.width = `${w}px`;
  pickerEl.style.display='block';
  pickerEl.setAttribute('aria-hidden','false');
}
function closePicker(p){ p.style.display='none'; p.setAttribute('aria-hidden','true'); }

document.getElementById('btn-open-tate').onclick=()=>{ buildTateGrid(); closePicker(pickerYoko); placeAndOpen(pickerTate); };
document.getElementById('btn-open-yoko').onclick=()=>{ buildYokoGrid(); closePicker(pickerTate); placeAndOpen(pickerYoko); };
document.getElementById('close-tate').onclick=()=> closePicker(pickerTate);
document.getElementById('close-yoko').onclick=()=> closePicker(pickerYoko);

addEventListener('resize', ()=>{
  if(pickerTate.style.display==='block') placeAndOpen(pickerTate);
  if(pickerYoko.style.display==='block') placeAndOpen(pickerYoko);
});

/* グリッド */
function buildTateGrid(){
  const grid=document.getElementById('grid-tate'); grid.innerHTML='';
  ROW_KEYS.forEach((label,idx)=>{
    const b=document.createElement('button'); b.className='btn'; b.textContent=label;
    b.onclick=()=>{ startGame({mode:'tate',row:ROW_KEY_INTERNAL[idx]}); closePicker(pickerTate); };
    grid.appendChild(b);
  });
  const s=document.createElement('button'); s.className='btn'; s.textContent='ひみつ';
  s.onclick=()=>{ startGame({mode:'tate'}); closePicker(pickerTate); };
  grid.appendChild(s);
}
function buildYokoGrid(){
  const grid=document.getElementById('grid-yoko'); grid.innerHTML='';
  DAN_KEYS.forEach(label=>{
    const b=document.createElement('button'); b.className='btn'; b.textContent=label;
    b.onclick=()=>{ startGame({mode:'yoko',dan:label}); closePicker(pickerYoko); };
    grid.appendChild(b);
  });
  const s=document.createElement('button'); s.className='btn'; s.textContent='ひみつ';
  s.onclick=()=>{ startGame({mode:'yoko'}); closePicker(pickerYoko); };
  grid.appendChild(s);
}

/* 起動 */
toHome();
</script>
