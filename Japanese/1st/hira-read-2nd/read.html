<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>ひらがな・よみ専用</title>

<!-- 既存の共通見た目があれば先に読む（任意） -->
<link rel="stylesheet" href="./app.css" />

<!-- この読みアプリ専用の最小CSS -->
<link rel="stylesheet" href="./read.css" />
</head>
<body data-phase="setup">
  <!-- ========== 50音オープン（既存の流儀を流用） ========== -->
  <div id="openPage" class="page">
    <div class="headgrid">
      <div class="title">50おん から えらんで ください</div>
      <div class="picked-wrap">
        <span class="badge big">えらんだもじ：<span id="selCount" class="count">0</span></span>
      </div>
      <button id="openSettings" class="gear-btn" title="教師設定">⚙</button>
    </div>

<div class="layout">
  <div class="rowpanel"><div id="rowBar" class="rowbar"></div></div>

  <div class="start-float">
    <button id="startBtnOpen" class="pill">▶ つぎへ</button>
  </div>

  <div class="main">
    <!-- ▼ 50音グリッド（右→左の列で pages_open.js が描画） -->
    <div class="grid" id="grid"></div>
    <div></div>
    <!-- ▼ 段ボタン列（あ段〜お段） -->
    <div class="dan-panel" id="danPanel">
      <div class="dancol" id="danCol"></div>
    </div>
    <div></div>
    <!-- ▼ クイック操作（全ON/全OFF/入替など） -->
    <div class="util" id="utilCol"></div>
  </div>
</div>

  <!-- ========== コース選択（3/5/10問など） ========== -->
  <div id="coursePage" class="page hidden">
    <div class="card center">
      <h2 class="center-title">なんもん とく？</h2>
      <div class="grid3">
        <button id="course3"  class="course-btn" type="button">3 もん</button>
        <button id="course5"  class="course-btn" type="button">5 もん</button>
        <button id="course10" class="course-btn" type="button">10 もん</button>
      </div>
      <button id="startCourse" class="start-hero" type="button" disabled>▶ はじめる</button>
      <button id="backToOpen" class="back-ghost" type="button">← 50おんにもどる</button>
    </div>
  </div>

  <!-- ========== 読み・本編（タップ→発音） ========== -->
  <div id="readPage" class="page hidden">
<div class="head">
  <span class="pill">よみ</span>
  <!-- ▼ 進捗バッジ：read_engine.js が書き換える -->
  <span id="r_progress" class="badge" style="margin-left:12px;">なんもんめ： 0 / 0</span>
  <!-- ▲ -->
</div>

    <div class="center">
      <div id="box" class="read-tap-card">
        <div id="r_kana" class="read-tap-kana">あ</div>
        <div class="read-tap-caption">タップして　はつおん</div>
      </div>

      <div id="r_message" class="muted" aria-live="polite">お題をタップして、はつおんしてね。</div>
      <div id="r_feedback" class="sj-blue" aria-live="polite"></div>
      <div id="r_heard" class="muted"></div>

      <div class="actions" style="display:flex; gap:12px; justify-content:center; margin-top:14px;">
        <button id="btn_hint"  type="button">ヒント（読み上げ）</button>
        <button id="btn_mute"  type="button">🔇 ミュート</button>
        <button id="btn_next"  type="button">▶ つぎへ</button>
      </div>
    </div>
  </div>

  <!-- ========== ふりかえり ========== -->
  <div id="reviewPage" class="page hidden">
    <div class="review-wrap">
      <h2>ふりかえり</h2>
      <div id="review" class="">
        <div id="review_grid" class="result-grid cols-5"></div>
        <div class="avg-box"><span class="avg-label">せいかい：</span><span id="r_frac" class="avg-value">0</span></div>
      </div>
      <div class="review-actions">
        <button id="retryCourse" type="button">もういちど</button>
        <button id="backOpenFromReview" type="button">50おんにもどる</button>
      </div>
    </div>
  </div>

<!-- ▼ 設定モーダル（pages_open.js が参照するIDに合わせる） -->
<div id="settingsBackdrop" style="position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:9999;">
  <div class="settings-dialog" style="background:#fff; border:1px solid #e5e5e5; border-radius:16px; width:min(640px,92vw); padding:20px 20px 16px; box-shadow:0 18px 36px rgba(0,0,0,.18);">
    <h2 style="margin:0 0 10px; font-size:1.3rem; font-weight:900; letter-spacing:.02em;">きょうし せってい</h2>

    <div class="settings-section" style="margin:14px 0;">
      <div class="settings-label" style="font-weight:700; margin-bottom:6px;">サンプル（必要に応じて中身を足せます）</div>
      <div class="settings-row" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <button type="button" class="toggle" aria-pressed="false" style="border:1px solid #cfd5dd; background:#fff; border-radius:12px; padding:.6rem 1.1rem; min-width:6ch;">トグル</button>
      </div>
      <div class="settings-note" style="color:#666; font-size:.95rem; margin:.4rem 0 0;">※「保存」または「とじる」で閉じます。</div>
    </div>

    <div class="settings-actions" style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
      <button id="settingsSave"  type="button" style="border:1px solid #cfd5dd; background:#fff; border-radius:12px; padding:.6rem 1.1rem;">保存</button>
      <button id="settingsClose" type="button" style="border:1px solid #cfd5dd; background:#fff; border-radius:12px; padding:.6rem 1.1rem;">とじる</button>
    </div>
  </div>
</div>
<!-- ▲ 設定モーダル -->

  <!-- ▼ 読み（50音UI＋読みエンジン） -->
  <script src="./core.js"></script>
  <script src="./pages_open.js"></script>
  <!-- ★ app.js は不要につき読み込まない -->
  <script src="./read_engine.js"></script>
  <script src="./read.js"></script>
  <!-- ▲ -->
</body>
</html>
