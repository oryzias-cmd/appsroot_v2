<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>ひらがな教材（読み／書き）</title>
<style>
  :root{
    --mm-scale: 3.78;   /* 1mm ≒ 3.78px */
    --box-mm: 50;       /* 書き（筆順）用の枠サイズ */
    --read-box-mm: 80;  /* 読み（発音）用の枠サイズ */
    --frame-mm: 1.0;
    --guide-mm: 0.3;
    --stack-gap: clamp(16px, 3vh, 32px);
    --kana-font: clamp(96px, 18vw, 220px);
    --msg-font: clamp(16px, 2.2vw, 22px);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "UD デジタル 教科書体 N-R","BIZ UDMincho","Yu Mincho","Hiragino Mincho ProN",serif; background:#f8fafc; color:#111; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

  .hidden { display:none !important; }

  .row { display:flex; gap:16px; }
  .col { flex:1; }

  .panel { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; }
  .panel.active {
    display: block;
  }
  .heading { font-weight:700; margin-bottom:12px; }

  .button { padding:10px 14px; border:1px solid #cfd8dc; background:#fff; border-radius:8px; cursor:pointer; }
  .button[aria-pressed="true"]{ background:#e8f0ff; border-color:#a7c0ff; }
  .button.primary { background:#2563eb; color:#fff; border-color:#1e4fe0; }
  .button.danger { background:#ef4444; color:#fff; border-color:#e11d48; }
  .grid { display:grid; gap:6px; grid-template-columns: repeat(11, 1fr); }
  .cell { height:40px; display:flex; align-items:center; justify-content:center; border:1px solid #e2e8f0; border-radius:6px; background:#fff; cursor:pointer; user-select:none; }
  .cell.selected { background:#fffae6; border-color:#f59e0b; }
  .cell.placeholder { opacity:.45; cursor:default; }
  .cell.empty { background:transparent; border:none; pointer-events:none; }

  .rowbar { display:flex; gap:6px; flex-wrap:wrap; }
  .rowbtn, .danbtn { padding:8px 10px; border:1px solid #cfd8dc; background:#fff; border-radius:999px; cursor:pointer; }
  .rowbtn[aria-pressed="true"], .danbtn[aria-pressed="true"] { background:#e8f0ff; border-color:#a7c0ff; }

  .workarea { display:flex; gap: 24px; align-items:flex-start; }
  .hand-left .workarea { flex-direction: row-reverse; }

  .box {
    border: calc(var(--frame-mm)*var(--mm-scale)*1px) solid #111;
    border-radius:4px; position:relative; background:#fff;
  }
  .box.write {
    width:  calc(var(--box-mm)*var(--mm-scale)*1px);
    height: calc(var(--box-mm)*var(--mm-scale)*1px);
  }
  .box.read {
    width:  calc(var(--read-box-mm)*var(--mm-scale)*1px);
    height: calc(var(--read-box-mm)*var(--mm-scale)*1px);
  }
  .box.guide::before, .box.guide::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(#999 0 0,#999 0 0) center/100% calc(var(--guide-mm)*var(--mm-scale)*1px),
                linear-gradient(#999 0 0,#999 0 0) center/calc(var(--guide-mm)*var(--mm-scale)*1px) 100%;
    opacity:.35;
  }
  canvas { display:block; }

  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .mini { font-size:12px; color:#475569; }

  /* ==== 読みページ（発音） ==== */
  .head { display:flex; justify-content:center; align-items:center; position:relative; margin-bottom: var(--stack-gap); }
  .pill { font-weight:700; background:#e8f0ff; color:#245; border-radius:999px; padding:10px 18px; font-size:clamp(20px,3.2vw,28px); }
  .tools { position:absolute; right:0; top:0; display:flex; gap:8px; }
  #r_kana { font-size: var(--kana-font); line-height:1; transform: translateY(2%); text-align:center; }
  .center { text-align:center; margin-top: var(--stack-gap); }
  #r_feedback { font-weight:700; font-size:clamp(22px,3.2vw,28px); }
  #r_message { font-size: var(--msg-font); margin-top:8px; }
  #r_heard { margin-top:6px; color:#666; font-size:14px; }
  .actions { display:flex; justify-content:center; gap: 28px; margin-top: calc(var(--stack-gap)*1.1); }
  #review .legend { margin-bottom:8px; }
  #review .grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap:12px; }
  #review .cellx { background:#fff; border:1px solid #dbe1e6; border-radius:12px; padding:8px 6px; text-align:center; }
  #review .cellx .ch { font-size: 40px; line-height:1; }
  #review .cellx .mark { font-size: 32px; font-weight:900; }
</style>
<link rel="stylesheet" href="./css/ui_50on.css">
<link rel="stylesheet" href="css/ui_50on.css?v=1">
</head>
<body>
<div class="wrap">

  <!-- ===================== オープンページ ===================== -->
  <section id="openPage" class="panel active">
    <div class="heading">50おん の せんたく</div>

    <div class="row" id="worksel">
      <div class="col">
        <div class="mini">えらんだ もじ：<span id="selCount">0</span></div>
        <div id="grid" class="grid" aria-label="50音グリッド"></div>
      </div>
      <div class="col" id="danPanel">
        <div class="heading">行・段 まとめて</div>
        <div class="rowbar" id="rowBar"></div>
        <div style="margin-top:10px;">
          <div id="danCol" class="rowbar"></div>
        </div>
        <div class="heading" style="margin-top:16px;">ユーティリティ</div>
        <div id="utilCol">
          <div class="controls">
            <button class="button" id="allOn">すべてON</button>
            <button class="button" id="allOff">すべてOFF</button>
            <button class="button" id="invert">いれかえ</button>
          </div>
          <div class="controls" style="margin-top:12px;">
            <button class="button" id="modeWriteBtn" aria-pressed="true">モード：書く</button>
            <button class="button" id="modeReadBtn" aria-pressed="false">モード：読む</button>
          </div>
        </div>
      </div>
    </div>

    <div class="controls" style="margin-top:16px;">
      <button class="button primary" id="startBtnOpen">つぎへ（コースせってい）</button>
      <button class="button" id="openSettings">せってい</button>
    </div>
    <!-- 50音グリッド横の「つ ぎ」の下あたりに追加 -->
    <div class="start-float">
      <button id="startBtnOpen" class="pill">つ　ぎ</button>
    <div style="height:10px"></div>
    <button id="startReadOpen" class="pill" style="background:#0b57d0;color:#fff;border-color:#0b57d0;">
    よ　む
    </button>
  </div>
</section>

  <!-- ===================== コース設定ページ ===================== -->
  <section id="coursePage" class="panel hidden">
    <div class="heading">コース を きめよう</div>
    <div class="controls">
      <span>なまえ</span>
      <input id="studentName" type="text" placeholder="（きろくONのとき）" style="padding:8px;border:1px solid #cfd8dc;border-radius:6px;">
      <button class="button" id="recordToggle" aria-pressed="false">きろく OFF</button>
    </div>

    <div class="controls" style="margin-top:10px;">
      <span>もんすう：</span>
      <button class="button" id="course3"  aria-pressed="false">3</button>
      <button class="button" id="course5"  aria-pressed="true">5</button>
      <button class="button" id="course10" aria-pressed="false">10</button>
    </div>

    <div class="controls" style="margin-top:10px;">
      <span>ひょうじ：</span>
      <label><input type="radio" name="scoreMode" value="numeric" checked> すうじ</label>
      <label><input type="radio" name="scoreMode" value="icon"> アイコン</label>
    </div>

    <div class="controls" style="margin-top:16px;">
      <button class="button primary" id="startCourse" disabled>スタート</button>
      <button class="button" id="backToOpen">50おんへ</button>
      <button class="button" id="openSettings2">せってい</button>
    </div>
  </section>

  <!-- ===================== 書きページ（筆順） ===================== -->
  <section id="writePage" class="panel hidden">
    <div class="controls" style="justify-content:space-between;">
      <div>なんもんめ：<span id="qIndex">1</span> / <span id="qTotal">5</span></div>
      <div class="controls">
        <button class="button" id="openSettings3">せってい</button>
        <button class="button" id="backToOpenFromWrite">50おんへ</button>
      </div>
    </div>

    <div id="workarea" class="workarea" style="margin-top:12px;">
      <div id="sampleWrap">
        <canvas id="sampleBox" class="box write guide"></canvas>
      </div>
      <div id="writeWrap">
        <canvas id="writeBox" class="box write guide"></canvas>
        <div class="controls" style="margin-top:10px;">
          <button class="button" id="hintBtn">ヒント（うすく見本）</button>
          <button class="button" id="clearBtn">けす（短押し=ひとつ戻る／長押し=ぜんぶ）</button>
        </div>
        <div class="controls" style="margin-top:10px;">
          <button class="button primary" id="scoreBtn">さいてん</button>
          <button class="button hidden" id="nextBtn">つぎへ</button>
          <button class="button hidden" id="retryBtn">もういちど</button>
        </div>
        <div class="panel" style="margin-top:10px;">
          <div id="scoreBox" style="font-size:18px; font-weight:700;"> </div>
          <div id="judgeComment" style="margin-top:6px;"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 読みページ（発音） ===================== -->
  <section id="readPage" class="panel hidden">
    <div class="head">
      <div class="pill" id="r_progress">なんもんめ： 1 / 5</div>
      <div class="tools">
        <button class="button" id="btn_mute">🔇 ミュート</button>
      </div>
    </div>

    <div class="box read guide" id="box" style="margin:0 auto;">
      <div id="r_kana">あ</div>
    </div>

    <div class="center">
      <div id="r_feedback"></div>
      <div id="r_message">お題をタップして、はつおんしてね。</div>
      <div id="r_heard"></div>
    </div>

    <div class="actions">
      <button class="button" id="btn_hint">ヒント</button>
      <button class="button primary" id="btn_next">つぎへ</button>
    </div>

    <section id="review" class="panel hidden" style="margin-top:16px;">
      <div class="legend">凡例： <b style="color:#e53935;">○</b>＝一発正解 ／ <b style="color:#2962ff;">△</b>＝途中で正解 ／ <b>×</b>＝未正解</div>
      <div id="review_grid" class="grid"></div>
      <div id="r_frac" style="margin-top:8px; font-weight:700;">せいかいしたかず： 0 / 0</div>
    </section>
  </section>

  <!-- ===================== 振り返り（書き） ===================== -->
  <section id="reviewPage" class="panel hidden">
    <div class="heading">ふりかえり（書き）</div>
    <div id="resultKanaRow" class="row cols-5" style="flex-wrap:wrap; gap:10px;"></div>
    <div class="panel" style="margin-top:10px;">
      へいきん：<span id="avgValue">0</span> てん
    </div>
    <div class="controls" style="margin-top:12px;">
      <button class="button primary" id="retryCourse">もういちど</button>
      <button class="button" id="backOpenFromReview">50おんへ</button>
      <button class="button" id="openSettings4">せってい</button>
    </div>
  </section>

  <!-- ===================== 設定モーダル（共通） ===================== -->
  <div id="settingsBackdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); align-items:center; justify-content:center;" aria-hidden="true">
    <div class="panel" style="width:min(520px, 92vw);">
      <div class="heading">せってい</div>

      <div style="margin:10px 0;">
        <div class="mini">ペンの太さ（採点のゆるさ）</div>
        <input id="inflateRange" type="range" min="0" max="8" step="1" value="3" />
        <span id="inflateVal">3</span>
      </div>

      <div style="margin:10px 0;">
        <div class="mini">ききとり音声など</div>
        <button class="button" id="toggleOverlay" aria-pressed="true">ON</button>
      </div>

      <div style="margin:10px 0;">
        <div class="mini">利き手</div>
        <label><input type="radio" name="handedPref" value="right" checked> 右</label>
        <label><input type="radio" name="handedPref" value="left"> 左</label>
      </div>

      <div style="margin:10px 0;">
        <div class="mini">50mm 校正バー</div>
        <div id="calibBarModal" style="height:8px; background:#1f2937; border-radius:999px;"></div>
        <div class="controls" style="margin-top:8px;">
          <button class="button" id="calibMinusM">-</button>
          <button class="button" id="calibPlusM">+</button>
        </div>
      </div>

      <div class="controls" style="justify-content:flex-end; gap:8px; margin-top:12px;">
        <button class="button" id="closeSettings">とじる</button>
        <button class="button primary" id="saveSettings">ほぞん</button>
      </div>
    </div>
  </div>

</div>

<!-- ====== スクリプト読み込み順：共通 → 書き → 読み ====== -->
<script src="js/common.js"></script>
<script src="js/write_engine.js"></script>
<script src="js/read_engine.js"></script>

<!-- 50音UI（先生の完成版。ここはコメントを外して有効に） -->
<script src="js/ui_50on.js?v=1"></script>
<!-- 完成版(ui_50on.js)の関数名を、現在の呼び出し名に橋渡しするアダプタ -->
<script>
(function(){
  "use strict";
  // 既に window.initGrid などがあるなら何もしない
  if (!window.initGrid) {
    // 先生の完成版でよくある別名候補 → 見つかったものを優先採用
    const candGrid   = window.buildGrid   || window.makeGrid   || window.createGrid;
    const candRowBar = window.buildRowBar || window.makeRowBar || window.createRowBar;
    const candDanCol = window.buildDanCol || window.makeDanCol || window.createDanCol;
    const candUtil   = window.wireUtilities || window.bindUtilities || window.setupUtilities;

    if (candGrid)   window.initGrid   = (sel)=> candGrid(sel);
    if (candRowBar) window.initRowBar = (sel)=> candRowBar(sel);
    if (candDanCol) window.initDanCol = (sel)=> candDanCol(sel);
    if (!window.wireUtilities && candUtil) window.wireUtilities = (sel)=> candUtil(sel);
  }
})();
</script>

<!-- ▼ フォールバックは “無効化” しておく（完成版があるので不要） -->
<!--
<script>
(function(){ "use strict";
  // ここに入っていた if(!window.initGrid){…} 等の一式（保険用）は
  // いったんコメントアウトしておきます。
})();
</script>
-->

<!-- ▼ DOM 構築後に一度だけ呼ぶ（完成版が提供する関数を呼ぶ） -->
<script>
document.addEventListener('DOMContentLoaded', ()=>{
  window.initGrid      && window.initGrid('#grid');
  window.initRowBar    && window.initRowBar('#rowBar');
  window.initDanCol    && window.initDanCol('#danCol');
  window.wireUtilities && window.wireUtilities('#utilCol');
});
</script>
<!-- 既存の順：stroke_judge_module.js → judge_bridge.js → js/common.js → js/bootstrap.js → js/write_engine.js -->
<script src="js/read_engine.js"></script>

</body>
</html>
